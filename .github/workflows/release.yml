# Builds the Windows installer. On a version tag (pushed by
# scripts/release.py) it also publishes it as a GitHub release, which is what
# every installed copy checks for (animeplayer/updates.py). Run it by hand
# from the Actions tab to get a test build without releasing anything.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Fetch libmpv and ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          # libmpv: shinchiro's builds, which mpv's own site links for Windows.
          # The plain x86_64 one, not -v3 (that needs a newer CPU).
          $mpv = gh release view --repo shinchiro/mpv-winbuild-cmake --json assets -q '.assets[].name' |
                 Where-Object { $_ -match '^mpv-dev-x86_64-\d.*\.7z$' } | Select-Object -First 1
          if (-not $mpv) { throw "No libmpv build found" }
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern $mpv --dir vendor
          7z e "vendor/$mpv" -ovendor libmpv-2.dll -r -y
          # ffmpeg (for downloads): BtbN's static builds.
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern 'ffmpeg-master-latest-win64-gpl.zip' --dir vendor
          7z e vendor/ffmpeg-master-latest-win64-gpl.zip -ovendor ffmpeg.exe ffprobe.exe -r -y
          Get-ChildItem vendor

      - name: Make the icon
        run: >
          python -c "from PIL import Image;
          Image.open('animeplayer/ui/assets/images/AP.png').convert('RGBA').save('vendor/AP.ico',
          sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Bundle with PyInstaller
        run: pyinstaller packaging/windows/animeplayer.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process dist/AnimePlayer/AnimePlayer.exe -ArgumentList '--selftest', "$PWD/selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Screenshots of the main pages
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:ANIMEPLAYER_DB_PATH = "$env:RUNNER_TEMP\ap-test\animeplayer.db"
          $env:ANIMEPLAYER_TEST_QML = "_TestTour.qml"
          $env:ANIMEPLAYER_TEST_SHOTS = "$PWD\shots"
          $env:QT_OPENGL = "software"
          $p = Start-Process dist/AnimePlayer/AnimePlayer.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill() }
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shots/
            selftest.json
          if-no-files-found: ignore

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "from animeplayer.version import VERSION; print(VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe

  # Linux and the Steam Deck. Built in Flathub's own build container.
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: AnimePlayer.flatpak
          manifest-path: packaging/flatpak/io.github.supred.animeplayer.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  # Once both are built: the release, with the installer and the bundle.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, flatpak]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        run: |
          tag="${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git tag -l --format='%(contents)' "$tag" > notes.md
          version="${tag#v}"
          cp artifacts/*/AnimePlayer.flatpak "AnimePlayer-${version}.flatpak"
          gh release create "$tag" artifacts/installer/*.exe "AnimePlayer-${version}.flatpak" \
            --title "Anime Player ${version}" --notes-file notes.md

