[project]
name = "animeplayer"
dynamic = ["version"]
description = "KDE-native anime player with AniList sync, powered by the same public backend ani-cli uses"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6",
    "httpx",
    "python-mpv",
    "keyring",
    "qrcode",
    "Pillow",
    # Learn Japanese: word splitting + readings (UniDic), and romaji.
    "fugashi",
    "unidic-lite",
    "cutlet",
    # Saved words as an Anki deck.
    "genanki",
    # Game controllers (Xbox, PlayStation, Switch, Steam Deck).
    "pysdl2",
    "pysdl2-dll",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[project.scripts]
animeplayer = "animeplayer.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "animeplayer.version.VERSION"}

[tool.setuptools.packages.find]
include = ["animeplayer*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
